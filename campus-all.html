<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国家会展中心 · 场馆地图</title>
  <link rel="stylesheet" href="./campus-3f.css" />
  <link rel="stylesheet" href="./campus-all.css?v=20260907-3" />
  <link rel="stylesheet" href="./campus-booths.css?v=1" />
  <link rel="stylesheet" href="./campus-ai.css?v=20260914-1" />
</head>
<body>
  <main class="map-shell">
    <header class="map-header">
      <div>
        <span class="eyebrow">NECC · VENUE MAP</span>
        <h1>国家会展中心 · 场馆地图</h1>
        <p id="mapStatus">正在识别两个楼层的门和设施…</p>
      </div>
      <div class="header-actions">
        <button type="button" id="showBooths">1.1馆展位</button>
        <button type="button" id="fitButton">双层全景</button>
        <button type="button" id="clearRouteButton" class="primary">退出导航</button>
      </div>
    </header>

    <section class="map-stage" id="mapStage" aria-label="F1和F3多层三维导航地图">
      <canvas id="mapCanvas" tabindex="0" aria-label="可拖动、旋转和缩放的F1、F3多层场馆地图"></canvas>
      <div class="hall-labels" id="hallLabels" aria-label="场馆与设施标记"></div>
      <div class="loading" id="loading">正在生成 F1 + F3…</div>

      <aside class="floor-card multi-floor-card">
        <strong id="viewCode">F1+F3</strong>
        <span id="viewName">F1 + F3 场馆总览</span>
        <small id="viewHint">楼层间距为示意距离</small>
        <div class="floor-switch" aria-label="切换楼层">
          <a class="active" data-view="ALL" href="./campus-all.html?view=ALL">双层</a>
          <a data-view="F1" href="./campus-all.html?view=F1">F1</a>
          <a data-view="F3" href="./campus-all.html?view=F3">F3</a>
        </div>
      </aside>

      <aside class="navigation-panel" aria-label="路线规划">
        <div class="panel-title">
          <div><small>室内导航</small><strong>规划路线</strong></div>
          <span class="route-state" id="routeState" aria-live="polite">未开始</span>
          <button type="button" id="navigationToggle" aria-expanded="false" aria-controls="navigationFields">展开导航</button>
        </div>
        <div id="navigationFields" class="navigation-fields">
        <label>
          <span>起点</span>
          <select id="startSelect" aria-label="导航起点"></select>
        </label>
        <label>
          <span>终点</span>
          <select id="destinationSelect" aria-label="导航终点"></select>
        </label>
        <fieldset>
          <legend>路线偏好</legend>
          <div class="preference-grid">
            <label><input type="radio" name="routePreference" value="default" checked><span>默认</span></label>
            <label><input type="radio" name="routePreference" value="elevator"><span>优先电梯</span></label>
            <label><input type="radio" name="routePreference" value="escalator"><span>优先扶梯</span></label>
            <label><input type="radio" name="routePreference" value="stairs"><span>优先楼梯</span></label>
          </div>
        </fieldset>
        <button type="button" id="routeButton" class="route-button">开始导航</button>
        <div class="route-summary" id="routeSummary" aria-live="polite">默认起点：F1 · 1.1馆 · 1号门</div>
        </div>
      </aside>

      <button type="button" class="ai-assistant-launcher" id="aiAssistantLauncher" aria-expanded="false" aria-controls="aiAssistantPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3Z"/><path d="m18.5 13 .7 2.3 2.3.7-2.3.7-.7 2.3-.7-2.3-2.3-.7 2.3-.7.7-2.3Z"/><path d="M5.5 13.5 6.4 16l2.6.9-2.6.9-.9 2.7-.9-2.7-2.6-.9 2.6-.9.9-2.5Z"/></svg>
        <span>AI观展助手</span>
      </button>

      <aside class="ai-panel" id="aiAssistantPanel" aria-label="AI观展助手" hidden>
        <div class="ai-panel-header">
          <span class="ai-panel-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3Z"/><path d="M5 14.5 6 17l2.5 1L6 19l-1 2.5L4 19l-2.5-1L4 17l1-2.5Z"/></svg></span>
          <div class="ai-panel-title"><strong>AI观展助手</strong><small>描述想看的行业、产品或技术</small></div>
          <span class="ai-connection" id="aiAssistantConnection">检测中</span>
          <button type="button" class="ai-close" id="aiAssistantClose" aria-label="关闭AI观展助手">×</button>
        </div>
        <div class="ai-scroll">
          <p class="ai-intro">可以查找本届展商，也可以直接说“最近的卫生间、电梯或出入口”，结果可一键导航。</p>
          <div class="ai-quick-list" aria-label="快捷需求">
            <button type="button" class="ai-quick" data-ai-query="新能源汽车">新能源汽车</button>
            <button type="button" class="ai-quick" data-ai-query="智能制造和工业自动化">智能制造</button>
            <button type="button" class="ai-quick" data-ai-query="新材料和复合材料">新材料</button>
            <button type="button" class="ai-quick" data-ai-query="医疗科技和医疗器械">医疗科技</button>
            <button type="button" class="ai-quick" data-ai-query="离我最近的卫生间">最近卫生间</button>
            <button type="button" class="ai-quick" data-ai-query="离我最近的电梯">最近电梯</button>
            <button type="button" class="ai-quick" data-ai-query="离我最近的出入口">最近出入口</button>
          </div>
          <div class="ai-answer" id="aiAssistantAnswer" aria-live="polite" hidden></div>
          <div class="ai-results" id="aiAssistantResults"></div>
        </div>
        <form class="ai-form" id="aiAssistantForm">
          <label for="aiAssistantInput">参观需求</label>
          <div class="ai-input-row">
            <textarea id="aiAssistantInput" rows="1" maxlength="200" placeholder="例如：最近的卫生间，或新能源汽车"></textarea>
            <button type="submit" class="ai-send" id="aiAssistantSend" aria-label="发送参观需求"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8-3-8Z"/><path d="M7 12h13"/></svg></button>
          </div>
          <div class="ai-form-status" id="aiAssistantStatus" aria-live="polite">已接入展商推荐与地图设施导航</div>
        </form>
      </aside>

      <div class="legend-card">
        <span><i class="floor-dot f3"></i>F3 展馆层</span>
        <span><i class="floor-dot f1"></i>F1 展馆层</span>
        <span><i class="route-dot"></i>当前路线</span>
      </div>
      <div class="gesture-hint">鼠标：左键平移 · 右键旋转 · 滚轮缩放｜触屏：单指平移 · 双指缩放/旋转</div>
    </section>
  </main>

  <div id="svgSourceF1" class="svg-source" aria-hidden="true"></div>
  <div id="svgSourceF3" class="svg-source" aria-hidden="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="./campus-all.js?v=20260914-2"></script>
  <script src="./campus-ai.js?v=20260914-2"></script>
</body>
</html>
